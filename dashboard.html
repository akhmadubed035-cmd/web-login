<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kenangan Kita Berdua ❤️</title>
    <style>
        body { font-family: sans-serif; background: #fff0f5; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { color: #e91e63; text-align: center; margin-top: 0; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #f8bbd0; border-radius: 8px; box-sizing: border-box; }
        button { background: #e91e63; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; width: 100%; font-size: 16px; cursor: pointer; }
        button:disabled { background: #ccc; }
        .momen { background: white; padding: 12px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .momen img { width: 100%; border-radius: 8px; }
        .momen small { color: #888; display: block; margin-top: 8px; }
        .momen p { margin: 8px 0 0; line-height: 1.5; white-space: pre-wrap; }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Cerita & Kenangan Kita ❤️</h1>
        <p style="text-align:center;">Tempat menyimpan momen jalan-jalan dan catatan kita berdua.</p>
    </div>

    <div class="card">
        <h3 style="color:#c2185b; margin-top:0;">➕ Tambah Momen Baru</h3>
        <input type="file" id="foto" accept="image/*">
        <textarea id="catatan" rows="3" placeholder="Tulis cerita atau catatan kenangan kita..."></textarea>
        <button id="btn" onclick="simpan()">Simpan Kenangan</button>
    </div>

    <h3 style="color:#c2185b;">📸 Koleksi Momen Kita</h3>
    <div id="list">Menghubungkan ke database...</div>
</div>

<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { initializeFirestore, collection, addDoc, onSnapshot } from "https://gstatic.com";

    const firebaseConfig = {
        apiKey: "AIzaSyD4fZ-ZF8CF0tvdLWW6s8_AjYuJ9kHcE14",
        authDomain: "://firebaseapp.com",
        projectId: "web-kenangan-26909",
        storageBucket: "web-kenangan-26909.firebasestorage.app"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, { experimentalForceLongPolling: true });
    const colRef = collection(db, "kenangan");

    function kecilkanFoto(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const max = 600;
                    const scale = max / img.width;
                    canvas.width = img.width > max ? max : img.width;
                    canvas.height = img.width > max ? img.height * scale : img.height;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.6));
                };
            };
        });
    }

    window.simpan = async function() {
        const file = document.getElementById('foto').files;
        const teks = document.getElementById('catatan').value;
        const btn = document.getElementById('btn');

        if (!file && !teks.trim()) {
            alert("Pilih foto atau tulis catatan dulu ya!");
            return;
        }

        btn.disabled = true;
        btn.innerText = "Menyimpan...";

        try {
            let imgData = file ? await kecilkanFoto(file) : null;
            const tgl = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            await addDoc(colRef, { gambar: imgData, teks: teks, tanggal: tgl, waktu: Date.now() });
            document.getElementById('foto').value = "";
            document.getElementById('catatan').value = "";
            alert("Berhasil disimpan! ❤️");
        } catch (err) {
            alert("Error: " + err.message);
        }
        btn.disabled = false;
        btn.innerText = "Simpan Kenangan";
    };

    onSnapshot(colRef, (snap) => {
        const list = document.getElementById('list');
        if (snap.empty) {
            list.innerHTML = "<p>Belum ada kenangan. Yuk upload yang pertama!</p>";
            return;
        }
        let items = [];
        snap.forEach(d => items.push(d.data()));
        items.sort((a, b) => (b.waktu || 0) - (a.waktu || 0));
        list.innerHTML = items.map(item => `
            <div class="momen">
                ${item.gambar ? `<img src="${item.gambar}">` : ''}
                <small>${item.tanggal || ''}</small>
                <p>${item.teks || ''}</p>
            </div>
        `).join('');
    }, (err) => {
        document.getElementById('list').innerHTML = "<p style='color:red;'>Gagal terhubung: " + err.message + "</p>";
    });
</script>
</body>
</html>
